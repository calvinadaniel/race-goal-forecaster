<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nav B · Bottom tabs (Strava/Runna)</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f3eb; --surface: #efe8dc; --ink: #1c2a22;
      --muted: rgba(28,42,34,0.62); --accent: #c45c26; --pine: #3f6b4f;
      --line: rgba(28,42,34,0.12);
      --display: "Bricolage Grotesque", system-ui, sans-serif;
      --sans: Manrope, system-ui, sans-serif;
      --mono: "IBM Plex Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: #d9d2c5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: var(--ink);
    }
    .phone {
      width: 390px; height: 844px;
      background: var(--bg);
      border-radius: 2rem;
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(28,42,34,0.18);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.1rem 0.75rem;
    }
    .logo { font-family: var(--display); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.03em; }
    .logo span { color: var(--accent); }
    .edit {
      border: 0;
      background: var(--accent);
      color: #fffaf5;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.78rem;
      padding: 0.55rem 0.85rem;
      border-radius: 0.65rem;
    }
    .main { padding: 0.5rem 1.1rem 1rem; overflow: auto; }
    .tag { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; }
    h1 { font-family: var(--display); font-size: 1.85rem; letter-spacing: -0.04em; line-height: 1.05; margin-bottom: 0.35rem; }
    .status { font-family: var(--display); font-size: 2.5rem; font-weight: 800; color: var(--pine); letter-spacing: -0.04em; }
    .clock { font-family: var(--mono); font-size: 1.1rem; margin: 0.35rem 0 1rem; }
    .clock span { color: var(--muted); }
    .kpis { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem; }
    .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 0.85rem; padding: 0.7rem; }
    .kpi .e { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .kpi .v { font-family: var(--mono); font-size: 1rem; font-weight: 600; margin-top: 0.25rem; }
    .card { background: #fffdf8; border: 1px solid var(--line); border-radius: 1rem; padding: 0.9rem; }
    .card p { color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
    .tabbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      background: #fffdf8;
      padding: 0.45rem 0.35rem calc(0.55rem + env(safe-area-inset-bottom, 0px));
    }
    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.35rem 0.2rem;
      display: grid;
      gap: 0.2rem;
      justify-items: center;
      cursor: pointer;
    }
    .tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tab.active { color: var(--accent); }
    .tab.active svg { stroke-width: 2.2; }
  </style>
</head>
<body>
  <!-- assumptions: Benchmark · Strava/Runna bottom tabs · Edit goal in header · Forecast active -->
  <div class="phone" aria-label="App shell direction B">
    <header>
      <div class="logo">Race Goal <span>Forecaster</span></div>
      <button class="edit" type="button">Edit goal</button>
    </header>
    <main class="main">
      <p class="tag">Direction B · Benchmark · Bottom tabs</p>
      <h1>Half · Oct 18</h1>
      <p class="status">On track</p>
      <p class="clock">1:42:18 <span>/ 1:45:00</span></p>
      <div class="kpis">
        <div class="kpi"><div class="e">Gap</div><div class="v">Ahead</div></div>
        <div class="kpi"><div class="e">Fitness</div><div class="v">98%</div></div>
        <div class="kpi"><div class="e">Volume</div><div class="v">92%</div></div>
      </div>
      <article class="card"><p>Most familiar fitness-app pattern: four bottom tabs with icons + labels. Home / Training / Forecast / Profile. Edit goal stays one tap in the header.</p></article>
    </main>
    <nav class="tabbar" aria-label="Primary">
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-10.5z"/></svg>
        Home
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 16l3-8 3 5 2-3 2 6"/><circle cx="7" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="17" cy="16" r="1.2" fill="currentColor" stroke="none"/></svg>
        Training
      </button>
      <button class="tab active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
        Forecast
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
        Profile
      </button>
    </nav>
  </div>
</body>
</html>
