<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nav C · Floating dock + profile sheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f3eb; --surface: #efe8dc; --ink: #1c2a22;
      --muted: rgba(28,42,34,0.62); --accent: #c45c26; --pine: #3f6b4f;
      --line: rgba(28,42,34,0.12);
      --display: "Bricolage Grotesque", system-ui, sans-serif;
      --sans: Manrope, system-ui, sans-serif;
      --mono: "IBM Plex Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: #d9d2c5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: var(--ink);
    }
    .phone {
      width: 390px; height: 844px;
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(196,92,38,0.12), transparent 55%),
        var(--bg);
      border-radius: 2rem;
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(28,42,34,0.18);
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      padding: 1.1rem 1.15rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-family: var(--display); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.03em; }
    .logo span { color: var(--accent); }
    .avatar {
      width: 2.1rem; height: 2.1rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--pine);
    }
    .avatar svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .main { padding: 0.75rem 1.15rem 6.5rem; overflow: auto; }
    .tag { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; }
    h1 { font-family: var(--display); font-size: 1.75rem; letter-spacing: -0.04em; line-height: 1.05; margin-bottom: 0.75rem; }
    .hero {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1.35rem;
      padding: 1.15rem;
      margin-bottom: 0.85rem;
      box-shadow: 0 16px 36px rgba(28,42,34,0.06);
    }
    .status { font-family: var(--display); font-size: 2.35rem; font-weight: 800; color: var(--pine); letter-spacing: -0.04em; }
    .clock { font-family: var(--mono); font-size: 1.05rem; margin-top: 0.3rem; }
    .clock span { color: var(--muted); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    .stat {
      background: #fffdf8;
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 0.85rem;
    }
    .stat .e { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .stat .v { font-family: var(--display); font-size: 1.35rem; font-weight: 700; margin-top: 0.25rem; letter-spacing: -0.03em; }
    .stat .h { color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; }
    .dock {
      position: absolute;
      left: 50%;
      bottom: 1.1rem;
      transform: translateX(-50%);
      width: calc(100% - 1.6rem);
      max-width: 22rem;
      background: rgba(28,42,34,0.92);
      color: #f7f3eb;
      border-radius: 999px;
      padding: 0.45rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.15rem;
      box-shadow: 0 18px 40px rgba(28,42,34,0.35);
    }
    .dock button {
      border: 0;
      background: transparent;
      color: rgba(247,243,235,0.55);
      font-family: var(--sans);
      font-size: 0.62rem;
      font-weight: 700;
      padding: 0.45rem 0.2rem 0.5rem;
      border-radius: 999px;
      display: grid;
      gap: 0.15rem;
      justify-items: center;
      cursor: pointer;
    }
    .dock button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .dock button.active {
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- assumptions: Designer · floating dark dock · avatar = Profile · Forecast content shown -->
  <div class="phone" aria-label="App shell direction C">
    <header>
      <div class="logo">Race Goal <span>Forecaster</span></div>
      <button class="avatar" type="button" aria-label="Profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
      </button>
    </header>
    <main class="main">
      <p class="tag">Direction C · Designer · Floating dock</p>
      <h1>Your forecast</h1>
      <div class="hero">
        <p class="status">On track</p>
        <p class="clock">1:42:18 <span>/ goal 1:45:00</span></p>
      </div>
      <div class="stats">
        <article class="stat"><div class="e">YTD miles</div><div class="v">842</div><div class="h">placeholder</div></article>
        <article class="stat"><div class="e">Avg pace</div><div class="v">8:12</div><div class="h">/mi placeholder</div></article>
        <article class="stat"><div class="e">Races ’26</div><div class="v">3</div><div class="h">completed</div></article>
        <article class="stat"><div class="e">Edit goal</div><div class="v" style="font-size:1.05rem;color:var(--accent)">Open →</div><div class="h">from Home</div></article>
      </div>
    </main>
    <nav class="dock" aria-label="Primary">
      <button type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-10.5z"/></svg>
        Home
      </button>
      <button type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 16l3-8 3 5 2-3 2 6"/><circle cx="7" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="17" cy="16" r="1.2" fill="currentColor" stroke="none"/></svg>
        Training
      </button>
      <button class="active" type="button" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
        Forecast
      </button>
      <button type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
        Profile
      </button>
    </nav>
  </div>
</body>
</html>
